[project]
name = "chezmoi-scripts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "json5>=0.14.0",
    "pyyaml>=6.0.3",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []
