repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/google/yamlfmt
  rev: v0.19.0
  hooks:
  - id: yamlfmt
- repo: local
  hooks:
  - id: jsonlint
    name: jsonlint
    language: system
    entry: scripts/jsonlint.py
    pass_filenames: false
    always_run: true
  - id: shellcheck
    name: shellcheck
    language: system
    entry: scripts/shellcheck.py
    pass_filenames: false
    always_run: true
