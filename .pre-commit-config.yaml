repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/google/yamlfmt
  rev: v0.19.0
  hooks:
  - id: yamlfmt
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.0
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/ComPWA/taplo-pre-commit
  rev: v0.9.3
  hooks:
  - id: taplo-format
- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.22.1
  hooks:
  - id: markdownlint-cli2
- repo: local
  hooks:
  - id: jsonlint
    name: jsonlint
    language: system
    entry: scripts/jsonlint.py
    pass_filenames: false
    always_run: true
  - id: shellcheck
    name: shellcheck
    language: system
    entry: scripts/shellcheck.py
    pass_filenames: false
    always_run: true
  - id: configlint
    name: configlint
    language: system
    entry: scripts/configlint.py
    pass_filenames: false
    always_run: true
