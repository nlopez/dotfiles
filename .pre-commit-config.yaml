repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.0
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v3.1.0
  hooks:
  - id: prettier
    # Node from the Nix profile; nodeenv's prebuilt download fails on prerelease versions.
    language_version: system
- repo: local
  hooks:
  - id: private-patterns
    name: private-patterns
    language: script
    entry: scripts/check-private.sh
    types: [text]
  - id: shellcheck
    name: shellcheck
    language: system
    entry: scripts/shellcheck.py
    pass_filenames: false
    always_run: true
    verbose: true
  - id: yamlfmt
    name: yamlfmt
    language: system
    entry: yamlfmt -conf .yamlfmt.yaml
    types: [yaml]
