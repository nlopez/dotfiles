# Rclone mount configuration — single source of truth.
#
# Accessible in chezmoi templates as {{ .data.mounts }}.
# After editing: chezmoi apply && rclone-mounts generate && rclone-mounts mount
#
# Each entry key is the mount name (used for launchd label, log file, script
# name, and default mountpoint). The `remote` field is the rclone remote name.
#
# To remove a mount: delete its entry, then run:
#   rclone-mounts unmount <name> && rclone-mounts generate

mounts:
  # ── Read-only: for media consumption (Plex/Jellyfin, browsing) ─────────────
  # No write cache; lower RAM usage; safe for multiple concurrent readers.
  media-ro:
    remote: media
    mountpoint: ~/mnt/media-ro
    read_only: true
    vfs_cache_mode: off
    dir_cache_time: 5m
    poll_interval: 1m
    attr_timeout: 1s
    allow_other: true
    allow_non_empty: false
    no_unicode_normalization: false
    log_level: INFO
    log_file: rclone-media-ro-mount.log
    nfs_cache_handle_limit: 1000000
    rc: true
    rc_addr: "localhost:5572"

  # ── Read-write: for uploads and library management ──────────────────────────
  # Full VFS cache enables random writes, seeking, and retry on failure.
  media-rw:
    remote: media
    mountpoint: ~/mnt/media-rw
    read_only: false
    vfs_cache_mode: full
    vfs_cache_max_size: 100G
    vfs_cache_max_age: 72h
    vfs_cache_poll_interval: 10m
    vfs_write_back: 5s
    dir_cache_time: 5m
    poll_interval: 1m
    attr_timeout: 1s
    allow_other: true
    allow_non_empty: false
    no_unicode_normalization: false
    log_level: INFO
    log_file: rclone-media-rw-mount.log
    nfs_cache_handle_limit: 1000000
    rc: true
    rc_addr: "localhost:5573"
