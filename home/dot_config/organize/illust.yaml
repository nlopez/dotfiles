# Imports illust_<id>.zip downloads and their illust_<id>/ folders from
# ~/Downloads into the Photos library (album "Pixiv"), then trashes the zip
# and the folder.
#
#   organize sim illust   # preview
#   organize run illust
rules:
- name: Unpack illust zips
  locations: ~/Downloads
  filters:
  - regex: '^illust_\d+\.zip$'
  actions:
  - shell: "ditto -x -k '{path}' '{path.parent}'"
  - trash
- name: Import illust folders into Photos
  locations: ~/Downloads
  targets: dirs
  filters:
  - regex: '^illust_\d+$'
  - python: |
      return any(not p.name.startswith(".") for p in path.rglob("*"))
  actions:
  # A failed import stops here, so the folder is only trashed once imported.
  - shell: "osxphotos import '{path}' --walk --skip-dups --album Pixiv"
  - trash
- name: Trash empty illust folders
  locations: ~/Downloads
  targets: dirs
  filters:
  - regex: '^illust_\d+$'
  - python: |
      return not any(not p.name.startswith(".") for p in path.rglob("*"))
  actions:
  - trash
