# Force VA-API to use the nvidia driver (libva-nvidia-driver), needed for
# hardware accelerated video decode in Brave Origin / other Chromium browsers.
#
# This must live in systemd --user's environment.d (not niri's own
# `environment {}` block) because apps launched via app2unit/vicinae run as
# systemd --user scopes and inherit the manager's environment, not niri's.
#
# NOTE: systemd's environment.d parser does not support `export` or quotes -
# unlike custom.conf in this same directory, which uses that (broken) syntax.
LIBVA_DRIVER_NAME=nvidia
