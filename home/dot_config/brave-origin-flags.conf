# Hardware accelerated video decode on NVIDIA (RTX 4090), via libva-nvidia-driver.
# Requires LIBVA_DRIVER_NAME=nvidia in the environment (set via
# ~/.config/environment.d/hardware-video-accel.conf, applied to systemd --user
# since apps are launched as systemd scopes, not as niri children).
# See: https://wiki.cachyos.org/configuration/enabling_hardware_acceleration_in_google_chrome/
#
# VaapiOnNvidiaGPUs is required in addition to VaapiIgnoreDriverChecks: without
# it, media/gpu/vaapi/vaapi_wrapper.cc hard-skips any device named "nvidia-drm"
# (confirmed via `strings` on the brave binary and by log output with
# --enable-logging=stderr --v=1 showing "Should skip nVidia device named:
# nvidia-drm" until this flag is added).
#
# PlatformHEVCDecoderSupport does NOT exist in this brave-origin-bin build
# (confirmed absent via `strings` on the binary) - there is no HEVC hardware
# decode path in this Brave build at all, VA-API included. Brave instead
# ships a bundled FFmpeg *software* HEVC decoder as a fallback specifically
# for "NVIDIA GPUs on Linux" (per its own flag description), gated behind
# kFFmpegSoftwareHEVCDecoder / brave://flags entry
# "brave-ffmpeg-software-hevc-decoder", disabled by default. That's what's
# needed for Plex Web HEVC playback here, not more VA-API flags.
#
# NOTE: tried adding Vulkan/VulkanFromANGLE + --use-gl=egl on top of this to
# test Vulkan-backed ANGLE for HEVC - it broke GPU init entirely (brave://gpu
# showed everything disabled/software only). Don't re-add those without
# figuring out why they conflict with this VA-API setup.
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-features=VaapiVideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,VaapiIgnoreDriverChecks,VaapiOnNvidiaGPUs,FFmpegSoftwareHEVCDecoder
