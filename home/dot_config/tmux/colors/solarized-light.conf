# Solarized Light — tmux color theme
# tab bar / status bar
set -g status-style                 bg=#eee8d5,fg=#586e75
set -g window-status-style          bg=#eee8d5,fg=#93a1a1
set -g window-status-current-style  bg=default,fg=#586e75,bold

# pane border — same style active and inactive
set -g pane-active-border-style     default
set -g pane-border-style            default
# reset pane backgrounds to terminal default (undo any previously set values)
set -g window-active-style          default
set -g window-style                 default
