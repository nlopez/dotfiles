# Solarized Dark — tmux color theme
# tab bar / status bar
set -g status-style                 bg=#073642,fg=#839496
set -g window-status-style          bg=#073642,fg=#586e75
set -g window-status-current-style  bg=default,fg=#93a1a1,bold

# pane backgrounds: active = base03, inactive = base02
set -g window-active-style          'bg=#002b36'
set -g window-style                 'bg=#073642'

# active pane border — solarized blue
set -g pane-active-border-style     fg=#268bd2,bold
