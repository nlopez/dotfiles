set -g focus-events on
set -s extended-keys on
set -g extended-keys-format csi-u
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ',*256color*:smcup@:rmcup@'
set -ga terminal-features 'xterm-256color:extkeys'

# explicitly set 'C-b' prefix
set -g prefix C-b
bind C-b send-prefix

# use 'C-v' to send prefix to nested tmux
bind-key -n C-v send-prefix

set -g mouse on

# Selection with mouse should copy to clipboard right away, in addition to the default action.
unbind -n -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# don't leave gaps in window numbering after closes
set -g renumber-windows on

# faster command sequences
set -s escape-time 50

# reload tmux conf
unbind R
bind R source-file ~/.config/tmux/tmux.conf\; display "Reloaded tmux configuration!"

bind-key m run-shell "~/.config/tmux/scripts/prompt-rename-window.sh"

# window movement binds
bind , previous-window
bind . next-window

# move windows left or right
bind < swap-window -t -1\; select-window -t -1
bind > swap-window -t +1\; select-window -t +1

# pane split binds
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane movement binds
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# status bar ------------------------------------------------------------------
set-option -g status-position bottom
# window labels: show index and name, with padding for spacing
set-window-option -g window-status-format "  #I: #W  "
set-window-option -g window-status-current-format "  #I: #W  "

#### statusbar ####
set -g status-justify left # center align window list
set -g status-left-length 48
set -g status-left ''
set -g status-right ''

# tab bar: solarized light (256-color)
# base2 (#eee8d5) for inactive, default (base3 #fdf6e3) for active
set -g status-style bg=#eee8d5,fg=#586e75
set -g window-status-style bg=#eee8d5,fg=#93a1a1
set -g window-status-current-style bg=default,fg=#586e75,bold

# pane content background: active pane = terminal solarized bg (base3), inactive = base2
set -g window-active-style 'bg=default'
set -g window-style 'bg=#eee8d5'

# more spacing between tabs
set -g window-status-separator '  '

# window/pane titling for terminal emulator (off = don't change host terminal window title)
set -g set-titles off
set-option -g allow-rename off
set-option -g automatic-rename off
# new windows start with the name 'untitled'
set-hook -g after-new-window 'rename-window untitled'

# confirm before killing a window or the server
bind-key K confirm kill-pane

bind-key @ command-prompt -p "create pane from:" "join-pane -s ':%%'"

bind-key \" list-windows

# environment
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# copy/paste and scrollback
set -g history-limit 50000
set-window-option -g mode-keys vi
# bind-key -T copy-mode-vi y send-key copy-pipe
# bind-key -T copy-mode-vi v send-key begin-selection

# Enable pane border only when window has more than one pane
set -g pane-border-status off
# Heavy box-drawing glyphs on the active pane, thin on inactive (tmux >=3.2).
set -g pane-border-lines heavy
# Highlight the active pane border in bright cyan + bold; inactive borders use
# the tmux default (no explicit dimming).
set -g pane-active-border-style fg=#268bd2,bold
# Colored arrows on the active pane's borders, on every side (3.2+).
set -g pane-border-indicators both
# Prefer push-updated @current_cmd (set via zsh preexec/precmd); fall back to ps
# lookup when the option is empty (non-zsh shells, nested programs, idle prompts).
set -g pane-border-format " #{?@current_cmd,#{@current_cmd},#(ps -o args= -p $(pgrep -nP #{pane_pid} 2>/dev/null || echo #{pane_pid}) 2>/dev/null | head -c 120)} "
set -g status-interval 5
set-hook -g pane-focus-in "set-option -Fw pane-border-status '#{?#{e|>:#{window_panes},1},top,off}'"
set-hook -g window-layout-changed "set-option -Fw pane-border-status '#{?#{e|>:#{window_panes},1},top,off}'"
set-hook -g after-select-window "run-shell '~/.config/tmux/scripts/window-switch.sh'"

unbind C-l
bind -n C-l clear-history\; send-keys "clear" C-m

set-option -g default-shell $SHELL

set -g window-size latest
setw -g aggressive-resize on
