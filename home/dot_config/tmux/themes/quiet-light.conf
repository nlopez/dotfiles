# vim:set ft=tmux:

# --> Quiet Light
# Ported from the VSCode Quiet Light theme
# https://github.com/microsoft/vscode/blob/main/extensions/theme-quietlight/themes/quietlight-color-theme.json

# Background / foreground
set -gq @thm_bg  "#F5F5F5"  # editor.background
set -gq @thm_fg  "#333333"  # default foreground

# Surface hierarchy (light → dark)
set -gq @thm_base     "#F5F5F5"  # editor background
set -gq @thm_mantle   "#F2F2F2"  # sideBar.background
set -gq @thm_crust    "#EDEDF5"  # activityBar.background

set -gq @thm_surface    "#C3B8D5"  # active window tab (r .764 g .721 b .834)
set -gq @thm_surface_0  "#EDEDF5"  # activityBar.background
set -gq @thm_surface_1  "#EDE8EF"  # sideBarSectionHeader.background
set -gq @thm_surface_2  "#C4B7D7"  # titleBar.activeBackground

set -gq @thm_overlay_0  "#C9D0D9"  # editor.selectionBackground
set -gq @thm_overlay_1  "#AAAAAA"  # comments
set -gq @thm_overlay_2  "#777777"  # operators / punctuation

set -gq @thm_muted    "#AAAAAA"  # comments (italic)
set -gq @thm_subtle   "#777777"  # operators / punctuation
set -gq @thm_text     "#333333"  # default text
set -gq @thm_subtext_0 "#6D705B"  # editorLineNumber.foreground
set -gq @thm_subtext_1 "#54494B"  # editorCursor.foreground
set -gq @thm_dark      "#333333"  # darkest text

# Accent colors (from syntax token colors)
set -gq @thm_blue     "#4B69C6"  # keywords / regex
set -gq @thm_cyan     "#91B3E0"  # HTML tags (steel blue, closest to cyan)
set -gq @thm_green    "#448C27"  # strings
set -gq @thm_orange   "#9C5D27"  # constants / numbers (amber)
set -gq @thm_red      "#AA3731"  # functions / headings
set -gq @thm_violet   "#7A3E9D"  # types / variables (purple)
set -gq @thm_yellow   "#C97A00"  # brightened amber
set -gq @thm_magenta  "#9769DC"  # focusBorder / active line number (bright purple)

# Catppuccin-compatible aliases
set -gq @thm_love   "#AA3731"  # red
set -gq @thm_gold   "#9C5D27"  # amber
set -gq @thm_rose   "#AA3731"  # red
set -gq @thm_pine   "#4B69C6"  # blue
set -gq @thm_foam   "#91B3E0"  # steel blue / cyan
set -gq @thm_iris   "#7A3E9D"  # purple

# Status bar
set -gq @thm_status_bg  "#705697"  # statusBar.background
set -gq @thm_status_fg  "#FFFFFF"   # white on purple

# Highlight levels
set -gq @thm_hl_low   "#E4F6D4"  # editor.lineHighlightBackground
set -gq @thm_hl_med   "#C9D0D9"  # editor.selectionBackground
set -gq @thm_hl_high  "#EDEDF5"  # activityBar.background
