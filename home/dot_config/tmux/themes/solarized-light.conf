# vim:set ft=tmux:

# --> Solarized Light
# Based on Ethan Schoonover's Solarized color scheme

# Theme background and foreground
set -gq @thm_bg "#fdf6e3"
set -gq @thm_fg "#657b83"

# Solarized Light colors (inverted from dark)
set -gq @thm_base     "#fdf6e3"  # base3
set -gq @thm_surface  "#eee8d5"  # base2
set -gq @thm_overlay  "#93a1a1"  # base1
set -gq @thm_muted    "#839496"  # base0
set -gq @thm_subtle   "#657b83"  # base00
set -gq @thm_text     "#586e75"  # base01
set -gq @thm_subtext  "#073642"  # base02
set -gq @thm_dark     "#002b36"  # base03

# Solarized accent colors (same in both variants)
set -gq @thm_blue     "#268bd2"
set -gq @thm_cyan     "#2aa198"
set -gq @thm_green    "#859900"
set -gq @thm_orange   "#cb4b16"
set -gq @thm_red      "#dc322f"
set -gq @thm_violet   "#6c71c4"
set -gq @thm_yellow   "#b58900"
set -gq @thm_magenta  "#d33682"

# Theme-specific aliases for compatibility
set -gq @thm_love     "#d33682"  # magenta
set -gq @thm_gold     "#b58900"  # yellow  
set -gq @thm_rose     "#cb4b16"  # orange
set -gq @thm_pine     "#268bd2"  # blue
set -gq @thm_foam     "#2aa198"  # cyan
set -gq @thm_iris     "#6c71c4"  # violet

# Surface levels for light theme
set -gq @thm_subtext_0 "#586e75"
set -gq @thm_subtext_1 "#657b83"
set -gq @thm_overlay_0 "#839496"
set -gq @thm_overlay_1 "#93a1a1"
set -gq @thm_overlay_2 "#93a1a1"
set -gq @thm_surface_0 "#eee8d5"
set -gq @thm_surface_1 "#eee8d5"
set -gq @thm_surface_2 "#eee8d5"
set -gq @thm_mantle    "#fdf6e3"
set -gq @thm_crust     "#fdf6e3"

# Status bar
set -gq @thm_status_bg  "#268bd2"  # Solarized blue
set -gq @thm_status_fg  "#fdf6e3"  # base3 (light) on blue

# Highlight levels
set -gq @thm_hl_low   "#eee8d5"
set -gq @thm_hl_med   "#93a1a1"
set -gq @thm_hl_high  "#839496"