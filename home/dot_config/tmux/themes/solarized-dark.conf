# vim:set ft=tmux:

# --> Solarized Dark
# Based on Ethan Schoonover's Solarized color scheme

# Theme background and foreground
set -gq @thm_bg "#002b36"
set -gq @thm_fg "#839496"

# Solarized Dark colors
set -gq @thm_base     "#002b36"  # base03
set -gq @thm_surface  "#073642"  # base02
set -gq @thm_overlay  "#586e75"  # base01
set -gq @thm_muted    "#657b83"  # base00
set -gq @thm_subtle   "#839496"  # base0
set -gq @thm_text     "#93a1a1"  # base1
set -gq @thm_subtext  "#eee8d5"  # base2
set -gq @thm_white    "#fdf6e3"  # base3

# Solarized accent colors
set -gq @thm_blue     "#268bd2"
set -gq @thm_cyan     "#2aa198"
set -gq @thm_green    "#859900"
set -gq @thm_orange   "#cb4b16"
set -gq @thm_red      "#dc322f"
set -gq @thm_violet   "#6c71c4"
set -gq @thm_yellow   "#b58900"
set -gq @thm_magenta  "#d33682"

# Theme-specific aliases for compatibility
set -gq @thm_love     "#d33682"  # magenta
set -gq @thm_gold     "#b58900"  # yellow  
set -gq @thm_rose     "#cb4b16"  # orange
set -gq @thm_pine     "#268bd2"  # blue
set -gq @thm_foam     "#2aa198"  # cyan
set -gq @thm_iris     "#6c71c4"  # violet

# Surface levels
set -gq @thm_subtext_0 "#93a1a1"
set -gq @thm_subtext_1 "#839496"
set -gq @thm_overlay_0 "#657b83"
set -gq @thm_overlay_1 "#586e75"
set -gq @thm_overlay_2 "#586e75"
set -gq @thm_surface_0 "#073642"
set -gq @thm_surface_1 "#073642"
set -gq @thm_surface_2 "#073642"
set -gq @thm_mantle    "#002b36"
set -gq @thm_crust     "#002b36"

# Highlight levels
set -gq @thm_hl_low   "#073642"
set -gq @thm_hl_med   "#586e75"
set -gq @thm_hl_high  "#657b83"