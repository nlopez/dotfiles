# Default apps, applied by .chezmoiscripts/darwin/run_after_configure-handlers.sh.tmpl
# with duti. `chezmoi diff` lists every entry whose live handler differs.
#
# Look up a file's UTI with `mdls -raw -name kMDItemContentType <file>` and an app's
# bundle ID with `osascript -e 'id of app "<Name>"'`. URL schemes that apps register
# for themselves (slack:, steam:, …) are left to the apps.
macos:
  handlers:
    # UTI → bundle ID (role: all)
    types:
      public.plain-text: com.microsoft.VSCode
      public.text: com.microsoft.VSCode
      public.source-code: com.microsoft.VSCode
      public.script: com.microsoft.VSCode
      public.shell-script: com.microsoft.VSCode
      public.json: com.microsoft.VSCode
      public.yaml: com.microsoft.VSCode
      public.xml: com.microsoft.VSCode
      public.comma-separated-values-text: com.microsoft.VSCode
      net.daringfireball.markdown: com.microsoft.VSCode
      com.adobe.xmp: com.microsoft.VSCode
      org.w3.webvtt: com.microsoft.VSCode
      public.x509-certificate: com.microsoft.VSCode
      # .ts files: macOS types them as MPEG transport streams, not TypeScript
      public.mpeg-2-transport-stream: com.microsoft.VSCode
      public.unix-executable: com.mitchellh.ghostty
      public.mpeg-4: io.mpv
      com.microsoft.waveform-audio: io.mpv
      public.html: org.mozilla.firefox
    # URL scheme → bundle ID
    schemes:
      http: org.mozilla.firefox
      https: org.mozilla.firefox
      mailto: org.mozilla.firefox
  # Work machines: overrides merged over `handlers`. Finicky routes links to the
  # right browser (~/.finicky.js).
  work_handlers:
    types:
      public.html: se.johnste.finicky
    schemes:
      http: se.johnste.finicky
      https: se.johnste.finicky
