packages:
  brew_prefix: /opt/homebrew
  darwin:
    brew_prefix: /opt/homebrew
    brew:
      taps:
        8ta4/plist: "https://github.com/8ta4/homebrew-plist"
        jundot/omlx: "https://github.com/jundot/omlx"
        cormacrelf/tap: "https://github.com/cormacrelf/homebrew-tap"
        smittytone/smittytone: "https://github.com/smittytone/homebrew-smittytone"
        libkrun/krun: "https://github.com/libkrun/homebrew-krun"
      brews:
        base:
        - wget
        - colima
        - libkrun/krun/krunkit
        - flock
        - skopeo
        - duti
        - sql-formatter
        - 8ta4/plist/plist
        - tree
        - ncdu
        - git
        - htop
        - gawk
        - tmux
        - uv
        - coreutils
        - diffutils
        - gnu-tar
        - gnu-sed
        - gnu-time
        - gnu-getopt
        - findutils
        - gnu-indent
        - gnu-which
        - grep
        - terminal-notifier
        - testssl
        - watchman
        - pv
        personal:
        - ffmpeg
        - media-info
        - jundot/omlx/omlx
        - resticprofile
      brew_options:
        jundot/omlx/omlx:
        - "--with-grammar"
        work:
      # Casks listed here will be installed with `--require-sha`. If a cask is
      # an autoupdate/:latest cask without a SHA, move it to casks_unsigned.
      casks:
        base:
        - notunes
        - grandperspective
        - obsidian
        - fsmonitor
        - wireshark-app
        - linearmouse
        - git-credential-manager
        - ghostty
        - tailscale-app
        - 1password
        - 1password-cli
        - visual-studio-code
        - jordanbaird-ice
        - rectangle
        - little-snitch
        - smittytone/smittytone/utitool
        personal:
        - macfuse
        - brave-origin
        - espanso
        - balenaetcher
        - digikam
        - stolendata-mpv
        - losslesscut
        - mediainfo
        - signal
        - telegram-desktop
        - zen
        - rustdesk
        work:
        - slack
        - google-drive
        - finicky
      # Casks that intentionally have no SHA (autoupdate or :latest). Installed
      # without --require-sha. Add entries here when a normal install fails with
      # "no checksum".
      casks_unsigned:
        base: []
        personal: []
        work: []
    uv:
      base:
      - pre-commit
      - unique-namer
      personal:
      - huggingface-hub
      - osxphotos
      work: []
    mas:
      base: []
      personal:
      - name: "1Blocker"
        id: 1365531024
      - name: "Kagi for Safari"
        id: 1622835804
      - name: "StopTheMadness Pro"
        id: 6471380298
    vscode:
      base: []
      personal: []
      work: []
    gnu_tools:
    - coreutils
    - diffutils
    - findutils
    - gawk
    - gnu-sed
    - gnu-tar
    - gnu-time
    - gnu-getopt
    - gnu-indent
    - gnu-which
    - grep
