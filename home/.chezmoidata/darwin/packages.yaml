packages:
  brew_prefix: /opt/homebrew
  darwin:
    brew_prefix: /opt/homebrew
    brew:
      taps:
        8ta4/plist: "https://github.com/8ta4/homebrew-plist"
        docker/tap: "https://github.com/docker/homebrew-tap"
        eugene1g/safehouse: "https://github.com/eugene1g/homebrew-safehouse"
        jundot/omlx: "https://github.com/jundot/omlx"
        ryooooooga/tap: "https://github.com/ryooooooga/homebrew-tap"
        cormacrelf/tap: "https://github.com/cormacrelf/homebrew-tap"
      brews:
        base:
          - distrobox
          - podman
          - age
          - git-lfs
          - jj
          - flock
          - skopeo
          - duti
          - mas
          - yamlfmt
          - sql-formatter
          - fx # json tui
          - 8ta4/plist/plist
          - tree
          - uutils-coreutils
          - hyperfine
          - ncdu
          - atuin
          - direnv
          - fd
          - fzf
          - git
          - yazi
          - htop
          - kubectl
          - ripgrep
          - rustup
          - ryooooooga/tap/zabrze
          - tmux
          - yq
          - jq
          - shellcheck
          - uv
          - pnpm
          - zoxide
          - k9s
          - go
          - coreutils
          - bat
          - eza
          - gnu-tar
          - gnu-sed
          - gnu-time
          - gnu-getopt
          - findutils
          - gnu-indent
          - gnu-which
          - grep
          - gh
          - terminal-notifier
          - testssl
          - cilium-cli
          - chezmoi
          - neovim
          - watchman
          - lazygit
          - pv
          - terminal-notifier
          - graphviz
          - helm
          - kubectx
          - kubernetes-cli
        personal:
          - ffmpeg
          - yt-dlp
          - oxipng
          - argocd
          - media-info
          - jundot/omlx/omlx
          - eugene1g/safehouse/agent-safehouse
        work:
          - awscli
          - tenv
          - glab
      # Casks listed here will be installed with `--require-sha`. If a cask is
      # an autoupdate/:latest cask without a SHA, move it to casks_unsigned.
      casks:
        base:
          - podman-desktop
          - copyq
          - cursor
          - docker/tap/sbx
          - grandperspective
          - obsidian
          - claude-code
          - fsmonitor
          - wireshark-app
          - zed
          - macfuse
          - linearmouse
          - standard-notes
          - git-credential-manager
          - ghostty
          - font-monocraft
          - tailscale-app
          - 1password
          - 1password-cli
          - visual-studio-code
          - jordanbaird-ice
          - rectangle
          - little-snitch
          - espanso
          - smittytone/smittytone/utitool
        personal:
          - balenaetcher
          - digikam
          - brave-browser
          - stolendata-mpv
          - losslesscut
          - mediainfo
          - signal
          - telegram-desktop
          - zen
          - keepingyouawake
          - rustdesk
        work:
          - slack
          - google-drive
          - finicky
          - cursor
      # Casks that intentionally have no SHA (autoupdate or :latest). Installed
      # without --require-sha. Add entries here when a normal install fails with
      # "no checksum".
      casks_unsigned:
        base:
          - google-chrome
        personal: []
        work: []
    uv:
      base:
        - pre-commit
        - unique-namer
        - huggingface-hub
        - osxphotos
      personal: []
      work: []
    mas:
      base: []
      personal:
        - name: "1Blocker"
          id: 1365531024
        - name: "Kagi for Safari"
          id: 1622835804
        - name: "StopTheMadness Pro"
          id: 6471380298
    vscode:
      base:
        - anthropic.claude-code
        - esbenp.prettier-vscode
        - golang.go
        - hashicorp.hcl
        - hashicorp.terraform
        - pkief.material-icon-theme
        - redhat.vscode-yaml
        - tamasfe.even-better-toml
        - timonwong.shellcheck
        - tailscale.vscode-tailscale
      personal: []
      work:
        - datadog.datadog-vscode
    gnu_tools:
      - gnu-sed
      - findutils
      - gawk
      - gnu-tar
      - gnu-time
      - gnu-getopt
      - gnu-indent
      - gnu-which
      - grep
