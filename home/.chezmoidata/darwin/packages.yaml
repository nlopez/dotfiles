packages:
  brew_prefix: /opt/homebrew
  darwin:
    brew_prefix: /opt/homebrew
    brew:
      # When true, `brew bundle` also uninstalls anything not declared here
      # (brew bundle cleanup --force). Preview first with `brew-cleanup`.
      cleanup: true
      # Taps are inferred from fully qualified names (owner/repo/name). List one
      # here only when its repo is not github.com/<owner>/homebrew-<repo>.
      taps:
        jundot/omlx: "https://github.com/jundot/omlx"
      # CLI tools live in Nix (.chezmoidata/nix.yaml), then mise
      # (.chezmoitemplates/mise/). Only formulae neither can install belong here.
      brews:
        base:
        - 8ta4/plist/plist
        # Intentional exception to Nix/mise preference: homebrew/core keeps
        # engram most up to date (Linux hosts still use mise).
        - engram
        personal:
        - jundot/omlx/omlx
        - libtiff
        work:
        # docker-buildx: ~/.docker/cli-plugins/docker-buildx links to the
        # Homebrew build; the Nix docker-client does not ship it.
        - docker-buildx
        # gcc and make install as gcc-N/gmake here; Nix's would shadow Apple's cc/make.
        - gcc
        - make
        # Not in nixpkgs.
        - gimme
        # Jodies ipcalc; nixpkgs' ipcalc is the unrelated Red Hat tool.
        - ipcalc
        # macOS (libkrun) build; nixpkgs' buildah is Linux-only.
        - libkrun/krun/buildah
      brew_options:
        jundot/omlx/omlx:
        - "with-grammar"
      # Casks listed here will be installed with `--require-sha`. If a cask is
      # an autoupdate/:latest cask without a SHA, move it to casks_unsigned.
      casks:
        base:
        - little-snitch
        - notunes
        - grandperspective
        - obsidian
        - fsmonitor
        - wireshark-app
        - ghostty
        - tailscale-app
        - 1password
        - visual-studio-code
        - jordanbaird-ice
        - rectangle
        - lulu
        - smittytone/smittytone/utitool
        # Not in nixpkgs or mise; Electron app shipped as a cask.
        - terminal-browser
        personal:
        - macfuse
        - brave-origin
        - espanso
        - stolendata-mpv
        - losslesscut
        - mediainfo
        - proton-mail-bridge
        - signal
        - telegram-desktop
        - rustdesk
        - claude
        - copyq
        - equibop
        - firefox
        - google-chrome
        - libreoffice
        - proton-drive
        - protonvpn
        - seadrive
        - slack
        - standard-notes
        - steam
        - syncthing-app
        - zed
        work:
        - slack
        - google-drive
        - finicky
        # CLI-only cask: packaged in nixpkgs, but its python3Packages.fabric
        # dependency is marked broken there.
        - azure-cli
        - claude
        - cursor-cli
        # Default browser (.chezmoidata/darwin/handlers.yaml).
        - firefox
        - github
        - kextviewr
        - knockknock
        - oversight
        - reikey
        - taskexplorer
      # Casks that intentionally have no SHA (autoupdate or :latest). Installed
      # without --require-sha. Add entries here when a normal install fails with
      # "no checksum".
      casks_unsigned:
        base: []
        personal: []
      # PyPI tools that neither Nix nor mise can install; brew bundle installs
      # them with `uv tool install` (uv itself comes from Nix).
      uv:
        base: []
        personal: []
    mas:
      personal:
      - name: "1Blocker"
        id: 1365531024
      - name: "1Password for Safari"
        id: 1569813296
      - name: "Kagi for Safari"
        id: 1622835804
      - name: "StopTheMadness Pro"
        id: 6471380298
