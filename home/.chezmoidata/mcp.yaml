# MCP servers launched via npx, shared by Claude (.chezmoitemplates/claude-mcp-servers)
# and Pi (dot_pi/agent/modify_mcp.json.tmpl).
# Renovate scans this file for npm:pkg@version patterns.
#
# Private MCP servers (work and personal) live in the encrypted private data;
# see docs/private-data.md and .chezmoitemplates/private-mcp-servers.
mcp:
  playwright: "npm:@playwright/mcp@0.0.85"
# One line per server, shown to the model in Pi's system prompt so it knows what
# each server is for. Private servers' lines live in the private data
# (mcp_descriptions) and are merged over these.
mcp_descriptions:
  playwright: "Drive a real browser: navigate, click, fill forms, screenshot pages"
  kagi: "Kagi web search and page summarization"
  slack: "Read Slack messages, threads, channels and links"
  google-calendar: "Read and manage Google Calendar events"
  "1password": "1Password item lookup"
  datadog: "Query Datadog logs, metrics, traces, monitors and dashboards"
