# Package configuration for Linux Aurora (Fedora Silverblue/Kinoite)
packages:
  brew_prefix: /home/linuxbrew/.linuxbrew
  linux:
    brew_prefix: /home/linuxbrew/.linuxbrew
    brew:
      brews:
        base:
          - gcc
          - make
          - bat
          - curl
          - chezmoi
          - direnv
          - neovim
          - fd
          - git
          - jq
          - mkcert
          - ripgrep
          - shellcheck
          - tmux
          - trash-cli
          - wget
          - yq
          - zsh
          - fdupes
          - ncdu
          - eza
          - tree
          - zoxide
          - hyperfine
          - bind
          - postgresql@14
          - ffmpeg
          - fzf
          - skopeo
          - yamlfmt
          - sql-formatter
          - fx
          - zsh-autosuggestions
          - zsh-fast-syntax-highlighting
          - argocd
          - atuin
          - ryooooooga/tap/zabrze
          - rclone
          - go
          - uv
          - yazi
          - helm
          - oxipng
          - rustup
          - node
          - pnpm
        personal:
          - doctl
        work: []
      casks:
        base:
          - font-microsoft-office
        personal: []
        work: []
      gnu_tools: []
