# Solarized palette — canonical hex values
# L*a*b values are the source of truth; all hex values are matched in sRGB space.
# Reference: https://ethanschoonover.com/solarized/
#
# Monotones (dark → light)
#   base03  base02            base01  base00  base0   base1             base2   base3
#   darkest dark-bg-highlight ···     ···     ···     ···               ···     lightest
#   ← used as bg in dark mode →       ← content tones (swap per mode) →        ← bg in light mode →
solarized:
  base03: "#002b36"
  base02: "#073642"
  base01: "#586e75"
  base00: "#657b83"
  base0: "#839496"
  base1: "#93a1a1"
  base2: "#eee8d5"
  base3: "#fdf6e3"
  # Accent colors (identical in both light and dark modes)
  yellow: "#b58900"
  orange: "#cb4b16"
  red: "#dc322f"
  magenta: "#d33682"
  violet: "#6c71c4"
  blue: "#268bd2"
  cyan: "#2aa198"
  green: "#859900"
