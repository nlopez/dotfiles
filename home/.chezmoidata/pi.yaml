# Pi — single source of truth for user packages.
# modify_settings.json.tmpl and run_onchange_after_pi-packages.py.tmpl
# read .pi.packages at template render time.
# Renovate scans this file for npm:pkg@version patterns.
# The Pi coding agent itself is installed out of band, not via chezmoi.
pi:
  packages:
  - "npm:pi-auto-theme@1.1.1"
  - "npm:pi-mcp-adapter@2.9.0"
  - "npm:pi-subagents@0.28.0"
  - "npm:context-mode@1.0.169"
  - "npm:pi-intercom@0.6.0"
  - "npm:pi-powerline@0.7.1"
  - "npm:@mjakl/pi-kagi-api@0.1.0"
  - "npm:pi-btw@0.4.0"
  - "npm:pi-markdown-preview@0.14.0"
  - "npm:pi-powerline-footer@0.13.0"
  - "npm:@juicesharp/rpiv-ask-user-question@2.4.0"
  # Installed only on personal (non-work) machines.
  personal_only_packages:
  - "npm:pi-lmstudio@1.3.0"
