# Pi — single source of truth for user packages.
# modify_settings.json.tmpl and run_after_pi-packages.py.tmpl
# read .pi.packages at template render time.
# Renovate scans this file for npm:pkg@version patterns.
# The Pi coding agent itself is installed out of band, not via chezmoi.
# The dd-pup extension is installed by pup itself, not by pi:
# run_onchange_after_04-pup-skills.sh.tmpl.
pi:
  packages:
  - "npm:pi-auto-theme@1.1.1"
  - "npm:pi-interrupt-steer@0.1.0"
  - "npm:pi-away@0.1.4"
  - "npm:pi-cc-monitor@0.13.1"
  - "npm:@mrclrchtr/supi-prompt-suggestions@14.0.0"
  - "npm:pi-intercom@0.18.1"
  - "npm:pi-subagents@0.90.0"
  - "npm:@getpipher/vision@0.5.3"
  - "npm:pi-worktree-extension@2.0.5"
  # Git-sourced packages; pi clones these itself. The reconcile script's
  # `pi update --extensions` installs or updates them; it prunes npm packages only.
  git_packages:
  - "git:github.com/ayghri/i-have-adhd@v0.4.1"
  - "git:github.com/odfalik/pi-transcript-search@a6f6e87e8c290d8cd2e46154d5e5616a8f4bc25d"
  # Installed only on work machines, together with the private work packages
  # (pi.packages and pi.local_packages in the private data; see
  # docs/private-data.md). Skipped on purpose: pi-mcp-adapter and
  # mcp-port-forward (pi >= 0.99 has built-in MCP), pi-npm-guard and
  # npm-update-cooldown (chezmoi/Renovate pin npm versions).
  work_packages:
  # Installed only on personal (non-work) machines.
  personal_only_packages: []
