nix:
  # nixpkgs revision every host's package set is built from (rendered into
  # ~/.config/nix/packages/flake.nix). Renovate bumps it to the current
  # nixpkgs-unstable head (see renovate.json).
  # renovate: datasource=git-refs packageName=https://github.com/NixOS/nixpkgs branch=nixpkgs-unstable
  nixpkgs_rev: ea9e3ef341e11c193537f674f821a99f9f436729
  # Unfree packages allowed in the set (matched against lib.getName / pname).
  unfree:
  - 1password-cli
  - claude-code
  - vault-bin
  # nixpkgs attribute paths ("python3Packages.foo" works). Installed into the
  # ~/.local/state/nix/profiles/dotfiles profile by
  # .chezmoiscripts/run_after_00-nix-packages.sh.tmpl.
  #
  # Anything not packaged in nixpkgs goes to mise (.chezmoitemplates/mise/),
  # then Homebrew on macOS (.chezmoidata/darwin/packages.yaml) as a last resort.
  packages:
    # Every host (macOS and Linux).
    base:
    - _1password-cli
    - age
    # atuin: release binary via .chezmoiexternal.toml.tmpl (mirrors setup.atuin.sh)
    - awscli2
    - bat
    - bazel_9
    - btop
    - carapace
    - chezmoi
    - claude-code
    - colima
    # dig: bind's dnsutils output (dig, nslookup, host).
    - dig
    - direnv
    - docker-client
    - fd
    - forgejo-cli
    - fzf
    - gh
    - ghq
    # gh-stack: wired as a gh extension via
    # dot_local/share/gh/extensions/gh-stack/symlink_gh-stack.tmpl — gh does
    # not discover gh-<name> binaries on PATH, only $XDG_DATA_HOME/gh/extensions.
    - gh-stack
    - git
    - go_latest
    - hyperfine
    - jq
    - k9s
    - kubectl
    - kubectx
    - kubernetes-helm
    - lima
    - mermaid-cli
    - ncdu
    - neovim
    - nodejs
    - pi-coding-agent
    - pnpm
    - pre-commit
    - pure-prompt
    # The python3 on PATH for hooks and render-time scripts; macOS's own is 3.9.
    - python3
    - ripgrep
    # rustup provides the cargo/rustc/rustfmt/clippy proxies; the toolchain
    # itself is installed by run_onchange_after_01-rustup-toolchain.sh.tmpl.
    - rustup
    - shellcheck
    - tenv
    - tmux
    - uv
    - velero
    - worktrunk
    - yamlfmt
    - yq-go
    - zoxide
    # zsh plugins (no framework): sourced explicitly from ~/.config/zsh/dot_zshrc.
    - zsh-autosuggestions
    - zsh-completions
    - zsh-fast-syntax-highlighting
    personal:
    - argocd
    - cilium-cli
    - cmctl
    - doctl
    - hubble
    - immich-cli
    - oxipng
    - python3Packages.huggingface-hub
    - restic
    - resticprofile
    - yt-dlp
    work:
    - aws-vault
    # azure-cli: Homebrew on macOS (.chezmoidata/darwin/packages.yaml), mise on
    # Linux (.chezmoitemplates/mise/linux-work.toml); its nixpkgs build depends
    # on python3Packages.fabric, which is marked broken.
    - glab
    - google-cloud-sdk
    - vault-bin
    # Linux only (macOS has darwin.trash below).
    linux:
      base:
      - trash-cli
    # macOS only (formerly Homebrew formulae, plus mac-only tools).
    darwin:
      base:
      # trash: accepts rm flags (-rf) silently, unlike Apple's /usr/bin/trash.
      - darwin.trash
      - duti
      - e2fsprogs
      - git-credential-manager
      - mas
      - pass
      - pv
      - skopeo
      - terminal-notifier
      - testssl
      - tree
      - wget
      - zsh
      # No GNU userland (coreutils, findutils, gnused, gnugrep, ...): Nix
      # installs them under their plain names, and the profile's bin/ comes
      # before /usr/bin, so they would shadow the BSD tools agents expect on
      # macOS. coreutils-prefixed provides GNU coreutils as gls, gdate, ...
      - coreutils-prefixed
      - curl
      - indent
      personal:
      - ffmpeg
      - mediainfo
      # osxphotos is marked broken on darwin in nixpkgs; it comes from brew
      # bundle's `uv` entries instead (.chezmoidata/darwin/packages.yaml).
      work:
      - crossplane-cli
      - jujutsu
      - kind
      # mutagen: syncs ~/notes (Obsidian vault) to workspaces;
      # see .chezmoiscripts/darwin/run_after_48-workspace-obsidian-sync.sh.tmpl.
      - mutagen
      - nbping
      - ninja
      - postgresql
      - protobuf
      - pyenv
      - rbenv
      - regal
      - shfmt
      - socat
      - watch
