# Shared pnpm packages (same across all platforms).
# Per-platform personal and work packages live in darwin/pnpm.yaml and
# linux/pnpm.yaml (merged by chezmoi at render time).
pnpm:
  base: []
  personal: []
  work: []
# Packages moved from pnpm globals to pi-managed packages (pi install npm:).
# The stale-removal script reads this list and uninstalls them.
stalePackages:
- pi-web-access
- pi-subagents
- context-mode
- pi-intercom
- pi-powerline
- pi-mcp-adapter
- pi-kagi-api
