# Platform-specific values — overridden per-OS via darwin/platform.yaml and
# linux/platform.yaml. Templates reference .platform.* keys instead of
# embedding .chezmoi.os conditionals.
platform:
  ssh_auth_sock: ~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock
  gpg_op_path: /Applications/1Password.app/Contents/MacOS/op-ssh-sign
  font_dir: Library/Fonts
  reload_path: /usr/bin:/bin:/usr/sbin:/sbin
