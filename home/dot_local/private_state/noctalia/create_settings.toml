config_version = 14

[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
center = [ "active_window" ]
end = [ "tray", "notifications", "network", "volume", "clock", "session" ]
start = [ "launcher", "workspaces", "group:g1" ]

[battery.device."/org/freedesktop/UPower/devices/headset_dev_80_C3_BA_9C_37_0A"]
warning_threshold = 20

[brightness]
enable_ddcutil = true

[control_center.calendar]
show_events_card = false

[dock]
enabled = true
layer = "overlay"
pinned = [ "com.mitchellh.ghostty", "code" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    command = ""
    enabled = true
    locked_timeout = 0.0
    resume_command = ""
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    command = ""
    enabled = true
    locked_timeout = 0.0
    resume_command = ""
    timeout = 605.0

[location]
address = "Astoria, NY"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@FALLBACK",
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
