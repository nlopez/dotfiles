[nightlight]
enabled = true

[notification]
history_retention_hours = 8
position = "bottom_center"

[shell]
date_format = "%a %b%e"
external_ip_enabled = true
font_family = "SF Pro"
settings_show_advanced = false
telemetry_enabled = true
time_format = "%k:%M"

    [shell.greeter_sync]
    auto_sync = false

    [shell.screenshot]
    copy_to_clipboard = true
    directory = "/home/localuser/Pictures/Screenshots"
    save_to_file = true

[theme]
community_palette = "Kemuri Koke"
mode = "auto"
source = "community"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "claude-code", "brave-origin", "gimp", "vscode", "vicinae", "fastfetch", "bat", "tmux" ]

[wallpaper]
fill_color = "secondary"

