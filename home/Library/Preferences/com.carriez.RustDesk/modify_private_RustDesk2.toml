#!/usr/bin/env python3
# Enforces RustDesk's server options; RustDesk owns the rest of the file.
import sys

WANT = {
    "direct-server": "Y",
    "stop-service": "N",
    "verification-method": "use-permanent-password",
    # Tailscale's IPv4 and IPv6 ranges. Relayed (ID) connections arrive from
    # the relay's address, so they are refused too.
    "whitelist": "100.64.0.0/10,fd7a:115c:a1e0::/48",
}

out, in_options, seen = [], False, set()


def add_missing():
    out.extend(f"{k} = '{v}'" for k, v in WANT.items() if k not in seen)


for line in sys.stdin.read().splitlines():
    if line.startswith("["):
        if in_options:
            add_missing()
        in_options = line.strip() == "[options]"
    elif in_options:
        key = line.split("=", 1)[0].strip()
        if key in WANT:
            seen.add(key)
            line = f"{key} = '{WANT[key]}'"
    out.append(line)

if in_options:
    add_missing()
elif "[options]" not in (l.strip() for l in out):
    out += ["", "[options]"]
    add_missing()

print("\n".join(out))
